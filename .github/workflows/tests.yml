name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backup-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Synthetic failure checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build maintained backup image
        run: docker build --tag rclone-backup:review .
      - name: PostgreSQL 17 and isolated WebDAV rehearsal
        run: |
          docker pull postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
          python3 tests/rehearse_image.py
